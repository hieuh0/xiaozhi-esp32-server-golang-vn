version: '3.8'

services:
  # MySQL数据库服务
  mysql:
    image: mysql:8.0
    container_name: xiaozhi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: xiaozhi_admin
    ports:
      - "23306:3306"        #可以不进行映射
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --skip-ssl
    networks:
      - xiaozhi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysql", "-h", "localhost", "-P", "3306", "-u", "root", "-ppassword", "-e", "SELECT 1"]
      timeout: 5s
      retries: 3
      interval: 10s
      start_period: 180s

  # MCP Filesystem server — file access tool for AI agents (wraps stdio via supergateway SSE)
  mcp-filesystem:
    image: node:20-alpine
    container_name: xiaozhi-mcp-filesystem
    command:
      - sh
      - -c
      - "npx -y supergateway --stdio 'npx -y @modelcontextprotocol/server-filesystem /workspace' --port 3001 --baseUrl http://mcp-filesystem:3001 --ssePath /sse --messagePath /message"
    ports:
      - "3001:3001"
    volumes:
      - ../../:/workspace:ro
    networks:
      - xiaozhi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3001"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 120s

  # MCP Memory server — long-term memory tool for AI agents (wraps stdio via supergateway streamable HTTP)
  mcp-memory:
    image: node:20-alpine
    container_name: xiaozhi-mcp-memory
    command:
      - sh
      - -c
      - "npx -y supergateway --stdio 'npx -y @modelcontextprotocol/server-memory' --port 3002 --baseUrl http://mcp-memory:3002 --ssePath /sse --messagePath /message"
    ports:
      - "3002:3002"
    networks:
      - xiaozhi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3002"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 120s

  # 主程序服务
  main-server:
    image: ghcr.io/hieuh0/xiaozhi_server:0.7.0
    container_name: xiaozhi-main-server
    command: ["/workspace/bin/xiaozhi_server", "-c", "/workspace/config/config.yaml"]
    ports:
      - "8989:8989"        # websocket服务 端口 18989端口
      - "2883:2883"        # mqtt server 12883
      - "8888:8888/udp"     # udp server 8888
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_started
      funasr-server:
        condition: service_started
      mcp-filesystem:
        condition: service_healthy
      mcp-memory:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=xiaozhi_admin
      - BACKEND_URL=http://backend:8080
      - FUNASR_HOST=funasr-server
      - FUNASR_PORT=10095
      - ONNXRUNTIME_LIB_PATH=/usr/local/lib/libonnxruntime.so
    volumes:
      - ../../config:/workspace/config
      - ../../logs:/workspace/logs
      - supertonic_models:/root/.cache/supertonic-model
    networks:
      - xiaozhi-network
    restart: unless-stopped

  # 后端管理服务
  backend:
    image: ghcr.io/hieuh0/xiaozhi_manager_backend:0.7.0
    container_name: xiaozhi-backend
    ports:
      - "8081:8080"        # 后端管理服务 端口 映射至宿主机 28080
    depends_on:
      mysql:
        condition: service_healthy
      voice-server:
        condition: service_started
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=xiaozhi_admin
      - AUDIO_BASE_PATH=/data/chat_history/audio
      - SPEAKER_SERVICE_URL=http://voice-server:8080
    volumes:
      - ../../manager/backend/config:/root/config
      - backend_audio_data:/data/chat_history/audio
      - supertonic_models:/root/.cache/supertonic-model
    networks:
      - xiaozhi-network
    restart: unless-stopped

  # 前端管理服务
  frontend:
    image: ghcr.io/hieuh0/xiaozhi_manager_frontend:0.7.0
    container_name: xiaozhi-frontend
    ports:
      - "8080:80"           # 前端管理服务 端口 映射至宿主机 18080
    depends_on:
      - backend
    networks:
      - xiaozhi-network
    restart: unless-stopped

  # Qdrant向量数据库服务（用于说话人识别）
  qdrant:
    image: qdrant/qdrant:latest
    container_name: xiaozhi-qdrant
    ports:
      - "6333:6333"         # REST API 端口
      - "6334:6334"         # gRPC 端口
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - xiaozhi-network
    restart: unless-stopped

  # FunASR语音识别服务（ASR transcription）
  funasr-server:
    build:
      context: ..
      dockerfile: Dockerfile.funasr
    container_name: xiaozhi-funasr-server
    command: ["python", "-m", "funasr.bin.inference_launch",
              "--model", "FunAudioLLM/Fun-ASR-MLT-Nano-2512",
              "--host", "0.0.0.0",
              "--port", "10095"]
    ports:
      - "10096:10095"
    volumes:
      - funasr_models:/root/.cache/modelscope
    networks:
      - xiaozhi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost',10095)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 1800s

  # ASR语音识别服务（说话人识别）
  voice-server:
    image: ghcr.io/hackers365/voice_server:0.1.2    # 替换为实际的镜像名称
    container_name: xiaozhi-voice-server
    ports:
      - "8082:8080"         # ASR服务端口 映射至宿主机 8082
    depends_on:
      - qdrant
    environment:
      - VAD_ASR_SPEAKER_ENABLED=true
      - VAD_ASR_SPEAKER_VECTOR_DB_HOST=qdrant
      - VAD_ASR_SPEAKER_VECTOR_DB_PORT=6334
      - VAD_ASR_SPEAKER_VECTOR_DB_COLLECTION_NAME=speaker_embeddings
      - VAD_ASR_SPEAKER_THRESHOLD=0.6
      - VAD_ASR_LOGGING_LEVEL=info
    volumes:
      - asr_data:/app/data
    networks:
      - xiaozhi-network
    restart: unless-stopped

volumes:
  mysql_data:
  backend_audio_data:
  qdrant_data:
  asr_data:
  funasr_models:
  supertonic_models:

networks:
  xiaozhi-network:
    driver: bridge
