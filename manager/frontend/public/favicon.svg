<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- WiFi arc (IoT) -->
  <circle cx="24" cy="13" r="1.8" fill="#22D3EE"/>
  <path d="M19,12 A6,6 0 0,1 29,12" fill="none" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M15.5,9 A11,11 0 0,1 32.5,9" fill="none" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round" opacity=".6"/>

  <!-- Chip body -->
  <rect x="7" y="15" width="34" height="26" rx="4" fill="url(#cg)"/>

  <!-- Pins LEFT (3) -->
  <rect x="2"  y="19" width="5" height="3" rx="1.5" fill="#60A5FA"/>
  <rect x="2"  y="25" width="5" height="3" rx="1.5" fill="#60A5FA"/>
  <rect x="2"  y="31" width="5" height="3" rx="1.5" fill="#60A5FA"/>

  <!-- Pins RIGHT (3) -->
  <rect x="41" y="19" width="5" height="3" rx="1.5" fill="#60A5FA"/>
  <rect x="41" y="25" width="5" height="3" rx="1.5" fill="#60A5FA"/>
  <rect x="41" y="31" width="5" height="3" rx="1.5" fill="#60A5FA"/>

  <!-- Pins BOTTOM (2) -->
  <rect x="15" y="41" width="3" height="5" rx="1.5" fill="#60A5FA"/>
  <rect x="30" y="41" width="3" height="5" rx="1.5" fill="#60A5FA"/>

  <!-- Voice bars (center) -->
  <rect x="16" y="23" width="3.5" height="10" rx="1.75" fill="url(#bg)"/>
  <rect x="21" y="19" width="3.5" height="18" rx="1.75" fill="url(#bg)"/>
  <rect x="26" y="21" width="3.5" height="14" rx="1.75" fill="url(#bg)"/>
  <rect x="31" y="23" width="3.5" height="10" rx="1.75" fill="url(#bg)"/>

  <!-- Live dot -->
  <circle cx="37" cy="19" r="2.2" fill="#22C55E"/>
</svg>
