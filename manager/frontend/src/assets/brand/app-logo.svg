<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E3A8A" flood-opacity="0.35"/>
    </filter>
    <filter id="gw">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- WiFi / IoT arcs -->
  <circle cx="80" cy="44" r="4.5" fill="#22D3EE" filter="url(#gw)"/>
  <path d="M67,41 A14,14 0 0,1 93,41" fill="none" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" filter="url(#gw)"/>
  <path d="M57,33 A26,26 0 0,1 103,33" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
  <path d="M47,25 A38,38 0 0,1 113,25" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" opacity=".4"/>

  <!-- Chip body -->
  <rect x="22" y="50" width="116" height="84" rx="10" fill="url(#cg)" filter="url(#sh)"/>
  <rect x="30" y="58" width="100" height="68" rx="6" fill="none" stroke="#3B82F6" stroke-width="1" opacity=".3"/>

  <!-- Pins LEFT -->
  <rect x="6"   y="61"  width="16" height="7" rx="3.5" fill="#60A5FA"/>
  <rect x="6"   y="73"  width="16" height="7" rx="3.5" fill="#60A5FA"/>
  <rect x="6"   y="85"  width="16" height="7" rx="3.5" fill="#60A5FA"/>
  <rect x="6"   y="97"  width="16" height="7" rx="3.5" fill="#60A5FA"/>
  <rect x="6"   y="109" width="16" height="7" rx="3.5" fill="#60A5FA"/>

  <!-- Pins RIGHT -->
  <rect x="138" y="61"  width="16" height="7" rx="3.5" fill="#60A5FA"/>
  <rect x="138" y="73"  width="16" height="7" rx="3.5" fill="#60A5FA"/>
  <rect x="138" y="85"  width="16" height="7" rx="3.5" fill="#60A5FA"/>
  <rect x="138" y="97"  width="16" height="7" rx="3.5" fill="#60A5FA"/>
  <rect x="138" y="109" width="16" height="7" rx="3.5" fill="#60A5FA"/>

  <!-- Pins BOTTOM -->
  <rect x="46"  y="134" width="7" height="16" rx="3.5" fill="#60A5FA"/>
  <rect x="63"  y="134" width="7" height="16" rx="3.5" fill="#60A5FA"/>
  <rect x="90"  y="134" width="7" height="16" rx="3.5" fill="#60A5FA"/>
  <rect x="107" y="134" width="7" height="16" rx="3.5" fill="#60A5FA"/>

  <!-- AI label + neural dots -->
  <circle cx="38" cy="66" r="3" fill="#6D28D9" opacity=".7"/>
  <text x="44" y="70" font-family="monospace" font-size="7" fill="#7C3AED" opacity=".6" font-weight="700">AI</text>
  <circle cx="42" cy="80" r="2.5" fill="#7C3AED" opacity=".5"/>
  <circle cx="52" cy="74" r="2.5" fill="#7C3AED" opacity=".5"/>
  <circle cx="62" cy="80" r="2.5" fill="#7C3AED" opacity=".5"/>
  <line x1="42" y1="80" x2="52" y2="74" stroke="#7C3AED" stroke-width="1" opacity=".4"/>
  <line x1="52" y1="74" x2="62" y2="80" stroke="#7C3AED" stroke-width="1" opacity=".4"/>
  <line x1="42" y1="80" x2="62" y2="80" stroke="#7C3AED" stroke-width="1" opacity=".3"/>

  <!-- Voice bars -->
  <rect x="68"  y="83" width="8" height="18" rx="4" fill="url(#bg)"/>
  <rect x="79"  y="74" width="8" height="36" rx="4" fill="url(#bg)" filter="url(#gw)"/>
  <rect x="90"  y="79" width="8" height="26" rx="4" fill="url(#bg)"/>
  <rect x="101" y="83" width="8" height="18" rx="4" fill="url(#bg)"/>

  <!-- Live dot -->
  <circle cx="116" cy="66" r="4"  fill="#22C55E"/>
  <circle cx="116" cy="66" r="7"  fill="none" stroke="#22C55E" stroke-width="1" opacity=".5"/>
</svg>
